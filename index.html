<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kwabo Coach</title>
<style>
:root{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
img{max-width:100%;}
[hidden]{display:none !important;}
:root{
  --ink:#14171C; --bg:#F7F4EE; --surface:#FFFFFF; --surface-2:#F0ECE3;
  --accent:#FF4B2E; --accent-ink:#FFFFFF; --accent-2:#0E9E78; --gold:#E8A200;
  --muted:#6E6A61; --line:#E4DED2; --danger:#D23B3B;
  --shadow:0 1px 2px rgba(20,17,10,.06), 0 8px 24px -12px rgba(20,17,10,.18);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#F3F1EA; --bg:#111316; --surface:#191C20; --surface-2:#20242A;
    --accent:#FF5A3C; --accent-ink:#14171C; --accent-2:#2BC494; --gold:#F0B23A;
    --muted:#9C978B; --line:#2A2E34; --danger:#FF6B6B;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ink:#F3F1EA; --bg:#111316; --surface:#191C20; --surface-2:#20242A;
  --accent:#FF5A3C; --accent-ink:#14171C; --accent-2:#2BC494; --gold:#F0B23A;
  --muted:#9C978B; --line:#2A2E34; --danger:#FF6B6B;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh;
  background:var(--bg); color:var(--ink);
  font-family:'Manrope',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
  padding-inline:16px; padding-block:0;
  display:flex; justify-content:center;
}
h1,h2,h3,.disp{font-family:'Big Shoulders Display',system-ui,sans-serif; text-transform:uppercase; letter-spacing:.01em; text-wrap:balance;}
.tabular{font-variant-numeric:tabular-nums;}
#app{width:100%; max-width:480px; min-height:100%; display:flex; flex-direction:column; position:relative;}

/* ---- top bar ---- */
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); padding-block:14px 10px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
.brand{display:flex; align-items:center; gap:9px;}
.brand-mark{width:30px; height:30px; border-radius:9px; background:var(--accent); display:flex; align-items:center; justify-content:center; color:var(--accent-ink); font-family:'Big Shoulders Display'; font-weight:800; font-size:18px; flex:none;}
.brand-name{font-family:'Big Shoulders Display'; font-weight:800; font-size:19px; letter-spacing:.02em; text-transform:uppercase;}
.brand-sub{font-size:10px; color:var(--muted); letter-spacing:.14em; text-transform:uppercase; margin-top:-2px;}
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;flex:none;}
.icon-btn:active{transform:scale(.96);}

/* ---- generic ---- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:18px; box-shadow:var(--shadow);}
.muted{color:var(--muted);}
.small{font-size:12.5px;}
.eyebrow{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); font-weight:700;}
.stack{display:flex; flex-direction:column; gap:12px;}
.row{display:flex; align-items:center; gap:10px;}
.row-wrap{flex-wrap:wrap;}
.between{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.spacer{flex:1;}
.hr{height:1px; background:var(--line); border:0; margin:2px 0;}

button{font-family:inherit;}
.btn{appearance:none; border:0; border-radius:13px; padding:13px 18px; font-weight:800; font-size:14.5px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; letter-spacing:.01em;}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.btn-primary{background:var(--accent); color:var(--accent-ink);}
.btn-primary:active{transform:scale(.98);}
.btn-primary:disabled{opacity:.45; cursor:not-allowed;}
.btn-ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line);}
.btn-ghost:active{transform:scale(.98);}
.btn-block{width:100%;}
.btn-sm{padding:9px 13px; font-size:13px; border-radius:10px;}
.link-btn{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:6px 0;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;text-align:left;}
.btn svg,.icon-btn svg,.link-btn svg{width:17px;height:17px;flex:none;display:block;}

.chip{border:1.5px solid var(--line); background:var(--surface); border-radius:12px; padding:11px 14px; font-weight:700; font-size:13.5px; cursor:pointer; text-align:left; display:flex; align-items:center; gap:9px; color:var(--ink);}
.chip.on{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--surface)); color:var(--ink);}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none;}
.chip.on .dot{background:var(--accent);}
.chip-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px;}
.chip-wide{grid-column:1/-1;}

input[type=text],input[type=number]{
  width:100%; background:var(--surface-2); border:1.5px solid var(--line); border-radius:12px; padding:12px 13px;
  font-size:15px; color:var(--ink); font-family:'Manrope'; font-weight:600;
}
input:focus{outline:2px solid var(--accent); outline-offset:1px;}
label.field{display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;}

.pill{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; font-size:11px; font-weight:800; letter-spacing:.03em; text-transform:uppercase;}
.pill-accent{background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent);}
.pill-ok{background:color-mix(in srgb, var(--accent-2) 18%, transparent); color:var(--accent-2);}
.pill-gold{background:color-mix(in srgb, var(--gold) 20%, transparent); color:var(--gold);}
.pill-line{background:var(--surface-2); color:var(--muted); border:1px solid var(--line);}

/* ---- onboarding ---- */
.progress-track{height:5px; background:var(--surface-2); border-radius:99px; overflow:hidden;}
.progress-fill{height:100%; background:var(--accent); border-radius:99px; transition:width .35s ease;}
.step-label{font-size:12px; color:var(--muted); font-weight:700;}
.obj-preset{width:100%; text-align:left; border:1.5px solid var(--line); background:var(--surface); border-radius:14px; padding:13px 14px; cursor:pointer;}
.obj-preset.on{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, var(--surface));}
.obj-preset h3{font-size:16px; margin:0 0 3px; text-transform:none; letter-spacing:0;}
.morph-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:9px;}
.morph-card{border:1.5px solid var(--line); border-radius:14px; padding:10px 6px 12px; text-align:center; background:var(--surface); cursor:pointer;}
.morph-card.on{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, var(--surface));}
.morph-card svg{width:40px;height:56px;}
.morph-card .lbl{display:block; font-size:11.5px; font-weight:800; margin-top:6px;}

/* ---- tabs ---- */
.tabbar{position:sticky; bottom:0; z-index:20; background:var(--bg); padding-block:8px calc(10px + env(safe-area-inset-bottom,0px)); margin-top:auto;}
.tabbar-inner{background:var(--surface); border:1px solid var(--line); border-radius:16px; display:flex; box-shadow:var(--shadow); padding:5px;}
.tab{flex:1; border:0; background:transparent; padding:9px 4px; border-radius:12px; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--muted); font-size:10.5px; font-weight:800; letter-spacing:.03em; text-transform:uppercase; cursor:pointer;}
.tab.on{background:var(--accent); color:var(--accent-ink);}
.tab svg{width:19px;height:19px;}

main{padding-bottom:16px; flex:1;}
.view{display:flex; flex-direction:column; gap:16px;}

/* ---- dashboard ---- */
.ring-wrap{position:relative; width:88px; height:88px; flex:none;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-label{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.ring-label b{font-family:'Big Shoulders Display'; font-size:22px; line-height:1;}
.ring-label span{font-size:9.5px; color:var(--muted); font-weight:700; text-transform:uppercase;}

.session-card{border:1.5px solid var(--line); border-radius:16px; overflow:hidden; background:var(--surface);}
.session-head{width:100%; text-align:left; padding:14px 15px; display:flex; align-items:center; gap:12px; background:none; border:0; cursor:pointer;}
.session-check{appearance:none; background:none; padding:0; color:inherit; width:26px;height:26px;border-radius:50%;border:2px solid var(--line); flex:none; display:flex; align-items:center; justify-content:center; cursor:pointer;}
.session-head:focus-visible,.session-check:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
.session-check.done{background:var(--accent-2); border-color:var(--accent-2); color:#fff;}
.session-title{font-weight:800; font-size:15px;}
.session-meta{font-size:12px; color:var(--muted); font-weight:600;}
.chev{transition:transform .2s ease; color:var(--muted); flex:none;}
.chev.open{transform:rotate(180deg);}
.session-body{padding:0 15px 15px; display:flex; flex-direction:column; gap:9px;}
.ex-row{display:flex; align-items:center; gap:11px; padding:10px 11px; background:var(--surface-2); border-radius:12px;}
.ex-type{width:6px; align-self:stretch; border-radius:4px; flex:none;}
.ex-name{font-weight:700; font-size:13.5px;}
.ex-scheme{font-size:12px; color:var(--muted); font-weight:700;}
.ex-cue{font-size:11.5px; color:var(--muted); margin-top:2px;}
.timer-row{display:flex; align-items:center; gap:8px; margin-top:7px;}
.timer-clock{font-size:15px; font-weight:800; letter-spacing:.02em;}
.move-fig{width:52px;height:52px;flex:none;color:var(--accent);}
.move-fig.big{width:96px;height:96px;}
.move-pose-a{animation:moveCrossA 1.8s ease-in-out infinite;}
.move-pose-b{animation:moveCrossB 1.8s ease-in-out infinite;}
@keyframes moveCrossA{0%,35%{opacity:1;}50%,85%{opacity:0;}100%{opacity:1;}}
@keyframes moveCrossB{0%,35%{opacity:0;}50%,85%{opacity:1;}100%{opacity:0;}}

.weight-row{display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px;}
.weight-row:last-child{border-bottom:0;}

/* ---- AI panel ---- */
.fab{position:fixed; right:calc(50% - 240px + 16px); bottom:calc(88px + env(safe-area-inset-bottom,0px)); z-index:25; width:54px;height:54px;border-radius:50%; background:var(--accent); color:var(--accent-ink); border:0; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; cursor:pointer;}
@media (max-width:512px){.fab{right:16px;}}
.sheet-backdrop{position:fixed; inset:0; background:rgba(10,9,6,.5); z-index:30; display:flex; align-items:flex-end;}
.sheet{width:100%; max-width:480px; margin:0 auto; background:var(--bg); border-radius:20px 20px 0 0; max-height:86vh; display:flex; flex-direction:column; box-shadow:var(--shadow);}
.sheet-head{padding:14px 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line);}
.sheet-body{padding:14px 16px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; flex:1;}
.msg{max-width:88%; padding:10px 13px; border-radius:14px; font-size:13.5px; line-height:1.45;}
.msg.me{align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:4px;}
.msg.ai{align-self:flex-start; background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:4px; white-space:pre-wrap;}
.msg.sys{align-self:center; color:var(--muted); font-size:12px; text-align:center;}
.sheet-suggest{display:flex; gap:8px; flex-wrap:wrap; padding:0 16px 10px;}
.sheet-suggest button{border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:7px 12px; font-size:12px; font-weight:700; color:var(--ink); cursor:pointer;}
.sheet-input{display:flex; gap:8px; padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line);}
.sheet-input input{flex:1;}
.typing{display:inline-flex; gap:4px;}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite ease-in-out;}
.typing i:nth-child(2){animation-delay:.2s;} .typing i:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

@media (prefers-reduced-motion:reduce){*{animation-duration:.001s !important; transition-duration:.001s !important;}}
[hidden]{display:none !important;}
</style>

function set(level, phase, byLevel, unit){
  var base = byLevel[level===1?'db':level===2?'int':'adv'];
  var sets = base[0], reps = base[1];
  var mult = phase===0?1:phase===1?1.15:1.3;
  reps = Math.max(reps, Math.round(reps*mult));
  // Exercice à séries/répétitions : un chronomètre de repos entre les séries a du sens.
  return {sets:sets, reps:reps, unit:unit||'répétitions', timerKind: sets>1 ? 'rest' : null};
}
function duration(level, phase, byLevel, unit){
  var v = byLevel[level===1?'db':level===2?'int':'adv'];
  var mult = phase===0?1:phase===1?1.15:1.3;
  // « blocs de 30/30 » : minuteur fractionné (effort/repos) ; sinon un simple compte à rebours, en secondes ou en minutes selon l'unité.
  var timerKind = unit.indexOf('30/30')>=0 ? 'interval3030' : 'countdown';
  var timerUnit = unit.indexOf('min')===0 ? 'm' : 's';
  return {sets:1, reps:Math.round(v*mult), unit:unit, timerKind:timerKind, timerUnit:timerUnit};
}

/* ================= STORAGE ================= */
var STORE_KEY='kwaboCoach:v1';
function loadState(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    var s = JSON.parse(raw);
    if(!s || typeof s!=='object') return null;
    return s;
  }catch(e){ return null; }
}
function saveState(s){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(s)); }catch(e){ /* stockage indisponible : la session continue sans persistance */ }
  queueCloudSync(s);
}

/* ================= COMPTE — synchronisation ================= */
var cloudSyncTimer = null;
function queueCloudSync(s, immediate){
  if(!supabaseClient || !session) return;
  if(cloudSyncTimer){ clearTimeout(cloudSyncTimer); cloudSyncTimer=null; }
  var run = function(){
    supabaseClient.from('profiles').upsert({ id: session.user.id, email: session.user.email, data: s }).then(function(res){
      if(res && res.error){ authNotice = 'La sauvegarde en ligne a échoué : tes données restent sur cet appareil.'; render(); }
    }).catch(function(){});
  };
  if(immediate) run(); else cloudSyncTimer = setTimeout(run, 900);
}
function loadRemoteProfile(){
  if(!supabaseClient || !session) return Promise.resolve(null);
  return supabaseClient.from('profiles').select('data').eq('id', session.user.id).maybeSingle().then(function(res){
    return (res && !res.error && res.data) ? res.data.data : null;
  }).catch(function(){ return null; });
}
function applyRemoteProfileOnSignIn(){
  return loadRemoteProfile().then(function(remote){
    if(remote && typeof remote==='object'){
      state = remote;
      try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
    } else if(state){
      queueCloudSync(state, true);
    }
    render();
  });
}
function sendMagicLink(email){
  if(!supabaseClient) return Promise.reject(new Error('Connexion indisponible sur cette version.'));
  var clean = String(email||'').trim().toLowerCase();
  if(!clean || clean.indexOf('@')<0) return Promise.reject(new Error('Entre une adresse e-mail valide.'));
  var redirect = window.location.origin + window.location.pathname;
  return supabaseClient.auth.signInWithOtp({ email: clean, options:{ emailRedirectTo: redirect } }).then(function(res){
    if(!res.error) return;
    var status = res.error.status;
    if(status===429) throw new Error('Trop de liens demandés d’un coup : attends quelques minutes puis réessaie.');
    if(status===400) throw new Error('Cette adresse e-mail semble invalide.');
    throw new Error('Le lien n’a pas pu être envoyé. Réessaie dans un instant.');
  });
}
function signOutAccount(){
  if(!supabaseClient) return Promise.resolve();
  return supabaseClient.auth.signOut().catch(function(){});
}

function timeAgoFr(iso){
  if(!iso) return '—';
  var ms = Date.now() - new Date(iso).getTime();
  var min = Math.floor(ms/60000);
  if(min<1) return 'à l’instant';
  if(min<60) return 'il y a '+min+' min';
  var h = Math.floor(min/60);
  if(h<24) return 'il y a '+h+' h';
  var d = Math.floor(h/24);
  if(d<30) return 'il y a '+d+' j';
  return new Date(iso).toLocaleDateString('fr-FR', {day:'2-digit', month:'short', year:'numeric'});
}

/* ================= PLAN GENERATOR ================= */
function seedFrom(str){
  var h=0; for(var i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))|0;}
  return Math.abs(h)||1;
}
function mulberry32(a){
  return function(){
    a|=0; a=a+0x6D2B79F5|0;
    var t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function shuffle(arr, rnd){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1)); var tmp=a[i]; a[i]=a[j]; a[j]=tmp;}
  return a;
}

/* Route chaque exercice vers la bonne séance par ZONE du corps (pas par « type » d'effort) : un exercice de jambes
   en force (squat, fentes…) reste une séance « Bas du corps », jamais « Haut du corps », même s'il partage son
   type avec un exercice de bras. */
var FOCUS_ROTATION = [
  {key:'bas', label:'Bas du corps & explosivité', zones:['bas']},
  {key:'haut', label:'Haut du corps & gainage', zones:['haut','gainage']},
  {key:'cardio', label:'Cardio & vitesse', zones:['cardio']},
  {key:'mobilite', label:'Mobilité & renforcement général', zones:['mobilite','gainage','bas','haut']}
];

function sessionsPerWeek(level){ return level===1?3:level===2?4:4; }

function generatePlan(profile){
  var weeks = profile.duration;
  var level = profile.level;
  var perWeek = sessionsPerWeek(level);
  var goals = goalsFor(profile.sports, profile.objectives);
  var rnd = mulberry32(seedFrom(profile.sports.join(',')+Object.values(profile.objectives||{}).join(',')+profile.morph+profile.weekSeed));
  var pool = EXO.filter(function(e){
    var sportOk = e.sport.indexOf('general')>=0 || profile.sports.some(function(sp){ return e.sport.indexOf(sp)>=0; });
    var goalOk = e.goals.some(function(g){ return goals.indexOf(g)>=0; });
    var levelOk = e.level <= level+1;
    return sportOk && goalOk && levelOk;
  });
  if(pool.length < 10){
    pool = EXO.filter(function(e){ return e.level<=level+1; });
  }

  var focusList = perWeek===3 ? [FOCUS_ROTATION[0],FOCUS_ROTATION[1],FOCUS_ROTATION[2]]
                              : [FOCUS_ROTATION[0],FOCUS_ROTATION[1],FOCUS_ROTATION[2],FOCUS_ROTATION[3]];

  var weeksOut=[];
  for(var w=0; w<weeks; w++){
    var phase = w < Math.ceil(weeks/3) ? 0 : (w < Math.ceil(weeks*2/3) ? 1 : (w===weeks-1 ? 0 : 2)); /* dernière semaine = semaine allégée */
    var deload = (w===weeks-1 && weeks>=4);
    var sessions=[];
    for(var d=0; d<focusList.length; d++){
      var focus = focusList[d];
      var candidates = shuffle(pool.filter(function(e){ return focus.zones.indexOf(e.zone)>=0; }), rnd);
      var count = deload ? 4 : 6;
      var chosen = candidates.slice(0, Math.min(count, candidates.length));
      if(chosen.length < 4){
        var more = shuffle(pool, rnd).filter(function(e){ return chosen.indexOf(e)<0; });
        chosen = chosen.concat(more.slice(0, 4-chosen.length));
      }
      var exos = chosen.map(function(e){
        var sc = e.scheme(level, deload?0:phase);
        return {name:e.name, type:e.type, move:e.move, cue:e.cue, sets:sc.sets, reps:sc.reps, unit:sc.unit, timerKind:sc.timerKind, timerUnit:sc.timerUnit};
      });
      sessions.push({
        id:'w'+w+'d'+d, focusKey:focus.key, title:focus.label,
        subtitle: deload ? 'Semaine allégée — récupération active' : 'Semaine '+(w+1),
        exercises: exos
      });
    }
    weeksOut.push({index:w, phase:phase, deload:deload, sessions:sessions});
  }
  return {weeks:weeksOut, generatedAt:Date.now(), perWeek:perWeek};
}

/* ================= REALISME OBJECTIF POIDS ================= */
function weightTimeEstimate(profile){
  if(!profile.targetWeight || !profile.weight) return null;
  var delta = profile.targetWeight - profile.weight;
  if(Math.abs(delta) < 0.5) return null;
  var gaining = delta > 0;
  var rateBase = gaining ? 0.22 : 0.45; /* kg/semaine, valeurs prudentes et réalistes */
  if(profile.level===1) rateBase *= 0.85;
  if(profile.level===3) rateBase *= 1.15;
  var weeksNeeded = Math.abs(delta) / rateBase;
  return {delta:delta, gaining:gaining, weeksLow:Math.round(weeksNeeded*0.8), weeksHigh:Math.round(weeksNeeded*1.3)};
}

/* ================= CHRONOMÈTRES ================= */
// Un seul chronomètre actif à la fois, identifié par « key » (id de séance + exercice + type).
// L'affichage du temps restant est mis à jour directement dans le DOM à chaque seconde (pas de render() complet, sinon on perdrait le focus et on rechargerait toute la page 60 fois/minute).
var activeTimer = null; /* {key, kind:'countdown'|'rest'|'interval3030', remaining, total, phase, round, rounds, running} */
var timerHandle = null;
function formatClock(totalSeconds){
  var total = Math.max(0, Math.round(totalSeconds));
  var m = Math.floor(total/60), s = total%60;
  return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;
}
function beepAndVibrate(){
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if(Ctx){
      var ctx = new Ctx();
      var osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type='sine'; osc.frequency.value=880; osc.connect(gain); gain.connect(ctx.destination);
      gain.gain.setValueAtTime(0.001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime+0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.4);
      osc.start(); osc.stop(ctx.currentTime+0.42);
      setTimeout(function(){ try{ ctx.close(); }catch(e){} }, 600);
    }
  }catch(e){ /* pas de son disponible : le repère visuel suffit */ }
  try{ if(navigator.vibrate) navigator.vibrate(220); }catch(e){}
}
function stopTimerInterval(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } }
function cancelActiveTimer(){ stopTimerInterval(); activeTimer=null; render(); }
function tickTimerDisplay(){
  var el = document.getElementById('timer-display');
  if(el && activeTimer) el.textContent = formatClock(activeTimer.remaining);
  var lbl = document.getElementById('timer-phase');
  if(lbl && activeTimer && activeTimer.kind==='interval3030') lbl.textContent = (activeTimer.phase==='work'?'Effort':'Repos')+' · manche '+activeTimer.round+'/'+activeTimer.rounds;
}
function startCountdownTimer(key, seconds, kind, onDone){
  stopTimerInterval();
  activeTimer = { key:key, kind:kind||'countdown', remaining:seconds, total:seconds, running:true, onDone:onDone };
  render();
  timerHandle = setInterval(function(){
    if(!activeTimer || activeTimer.key!==key){ stopTimerInterval(); return; }
    activeTimer.remaining -= 1;
    if(activeTimer.remaining <= 0){
      activeTimer.remaining=0; stopTimerInterval(); activeTimer.running=false; beepAndVibrate();
      var cb=activeTimer.onDone; render(); if(cb) cb();
      return;
    }
    tickTimerDisplay();
  }, 1000);
}
function startIntervalTimer(key, rounds, onDone){
  stopTimerInterval();
  activeTimer = { key:key, kind:'interval3030', phase:'work', remaining:30, round:1, rounds:rounds, running:true, onDone:onDone };
  render();
  timerHandle = setInterval(function(){
    if(!activeTimer || activeTimer.key!==key){ stopTimerInterval(); return; }
    activeTimer.remaining -= 1;
    if(activeTimer.remaining <= 0){
      beepAndVibrate();
      if(activeTimer.phase==='work'){ activeTimer.phase='rest'; activeTimer.remaining=30; }
      else if(activeTimer.round >= activeTimer.rounds){
        stopTimerInterval(); activeTimer.running=false;
        var cb=activeTimer.onDone; render(); if(cb) cb();
        return;
      }
      else { activeTimer.round += 1; activeTimer.phase='work'; activeTimer.remaining=30; }
      render(); return;
    }
    tickTimerDisplay();
  }, 1000);
}
/** Petit contrôle de chronomètre pour une ligne d'exercice ; retourne null si l'exercice n'en a pas besoin. */
function timerControl(key, e){
  if(!e.timerKind) return null;
  var wrap=h('div','timer-row');
  var isActive = activeTimer && activeTimer.key===key;
  if(e.timerKind==='rest'){
    if(isActive){
      var disp=h('span','tabular timer-clock'); disp.id='timer-display'; disp.textContent=formatClock(activeTimer.remaining);
      wrap.appendChild(h('span','small muted','Repos ')); wrap.appendChild(disp);
      var cancel=h('button','link-btn','Annuler'); cancel.onclick=function(){ cancelActiveTimer(); };
      wrap.appendChild(cancel);
    } else {
      var startBtn=h('button','btn btn-ghost btn-sm','⏱ Repos 60 s');
      startBtn.onclick=function(){ startCountdownTimer(key, 60, 'rest'); };
      wrap.appendChild(startBtn);
    }
    return wrap;
  }
  if(e.timerKind==='interval3030'){
    if(isActive){
      var disp2=h('span','tabular timer-clock'); disp2.id='timer-display'; disp2.textContent=formatClock(activeTimer.remaining);
      var phaseLbl=h('span','small', (activeTimer.phase==='work'?'Effort':'Repos')+' · manche '+activeTimer.round+'/'+activeTimer.rounds); phaseLbl.id='timer-phase';
      wrap.appendChild(phaseLbl); wrap.appendChild(disp2);
      var cancel2=h('button','link-btn','Arrêter'); cancel2.onclick=function(){ cancelActiveTimer(); };
      wrap.appendChild(cancel2);
    } else {
      var startBtn2=h('button','btn btn-primary btn-sm','▶ Lancer le fractionné');
      startBtn2.onclick=function(){ startIntervalTimer(key, e.reps); };
      wrap.appendChild(startBtn2);
    }
    return wrap;
  }
  // countdown
  var seconds = e.timerUnit==='m' ? e.reps*60 : e.reps;
  if(isActive){
    var disp3=h('span','tabular timer-clock'); disp3.id='timer-display'; disp3.textContent=formatClock(activeTimer.remaining);
    wrap.appendChild(disp3);
    var cancel3=h('button','link-btn','Arrêter'); cancel3.onclick=function(){ cancelActiveTimer(); };
    wrap.appendChild(cancel3);
  } else {
    var startBtn3=h('button','btn btn-primary btn-sm','▶ '+formatClock(seconds));
    startBtn3.onclick=function(){ startCountdownTimer(key, seconds, 'countdown'); };
    wrap.appendChild(startBtn3);
  }
  return wrap;
}

var draft = blankDraft();
var step = 0;
var TEAM_STEP_ORDER=[2,3,5];
/* Réunit les objectifs de sport (goalTags) choisis pour tous les sports sélectionnés : la génération du programme s'appuie sur cette union. */
function goalsFor(sportsArr, objectivesMap){
  var goals=[];
  (sportsArr||[]).forEach(function(sp){
    var oid=(objectivesMap||{})[sp];
    var obj=findObjective(sp, oid);
    if(obj) obj.goals.forEach(function(g){ if(goals.indexOf(g)<0) goals.push(g); });
  });
  return goals;
}
function sportDisplayLabel(sp, otherSportName){
  if(sp==='autre' && otherSportName) return otherSportName;
  return (SPORTS.filter(function(s){return s.id===sp;})[0]||{}).label;
}
function sportsLabelOf(sportsArr, otherSportName){
  return (sportsArr||[]).map(function(sp){ return sportDisplayLabel(sp, otherSportName); }).filter(Boolean).join(' + ');
}
function objectivesLabelOf(sportsArr, objectivesMap, otherSportName){
  return (sportsArr||[]).map(function(sp){
    var oid=(objectivesMap||{})[sp]; var obj=findObjective(sp, oid);
    return obj ? obj.title+(sportsArr.length>1?' ('+sportDisplayLabel(sp, otherSportName)+')':'') : null;
  }).filter(Boolean).join(' · ');
}
/* Lien d'équipe (?team=...) : un coach fixe sport/objectif/durée, chaque joueur garde son niveau et sa morphologie. */
if(!state){
  var teamFromUrl = readTeamFromLocation();
  if(teamFromUrl){
    draft.team = teamFromUrl; draft.sports = [teamFromUrl.sport]; draft.objectives = {}; draft.objectives[teamFromUrl.sport] = teamFromUrl.objectiveId; draft.duration = teamFromUrl.duration;
    step = 2;
  }
}
var activeTab = 'home';
var openSession = null;
var aiOpen = false;
var aiMessages = [];
var aiBusy = false;
var aiCapability = undefined; /* undefined = pas encore résolu, null = indisponible, objet = prêt */
var coachOpen = false;
var coachDraft = { sport:null, objectiveId:null, duration:8 };
var coachLink = '';
/* Mode séance guidée (lecture à voix haute + commandes vocales facultatives) */
var voiceSession = null; /* {session, index} */
var voiceListening = false;
var voiceStatus = '';
var voiceRecognizer = null;
var voiceSupported = (typeof window!=='undefined') && !!(window.SpeechRecognition || window.webkitSpeechRecognition);
var ttsSupported = (typeof window!=='undefined') && !!window.speechSynthesis;

if(typeof window!=='undefined' && window.claude && window.claude.use){
  window.claude.use('sample').then(function(s){ aiCapability = s; render(); }).catch(function(){ aiCapability=null; render(); });
} else {

}

/* ================= RENDER ================= */
function render(){
  app.innerHTML='';
  if(coachOpen){ app.appendChild(renderCoachSetup()); return; }
  if(!state){ app.appendChild(renderOnboarding()); return; }
  app.appendChild(renderTopbar());
  var main = document.createElement('main');
  if(activeTab==='home') main.appendChild(renderHome());
  else if(activeTab==='program') main.appendChild(renderProgram());
  else if(activeTab==='meals') main.appendChild(renderMealsTab());
  else main.appendChild(renderProfileTab());
  app.appendChild(main);
  app.appendChild(renderFab());
  app.appendChild(renderTabbar());
  if(aiOpen) app.appendChild(renderAiSheet());
  if(voiceSession) app.appendChild(renderVoiceSheet());
  if(adminOpen && isAdmin()) app.appendChild(renderAdminDashboard());
}

function h(tag, cls, html){
  var el=document.createElement(tag);
  if(cls) el.className=cls;
  if(html!==undefined) el.innerHTML=html;
  return el;
}

/* ---------- topbar ---------- */
function renderTopbar(){
  var bar=h('div','topbar');
  var brand=h('div','brand');
  brand.innerHTML='<div class="brand-mark">K</div><div><div class="brand-name">Kwabo Coach</div><div class="brand-sub">Entraînement personnalisé</div></div>';
  bar.appendChild(brand);
  var btn=h('button','icon-btn', icon('refresh'));
  btn.title='Réinitialiser mon profil';
  btn.onclick=function(){
    if(confirm('Effacer ton profil et ton programme sur cet appareil ?')){
      state=null; saveState(null); localStorage.removeItem(STORE_KEY); step=0; draft=blankDraft(); render();

/* ---------- ONBOARDING ---------- */
var STEP_LABELS=['Ton sport','Ton objectif','Ta morphologie','Ton niveau','Durée du cycle','Résumé'];
function renderOnboarding(){
  var wrap=h('div');
  var top=h('div','topbar');
  var brand=h('div','brand'); brand.innerHTML='<div class="brand-mark">K</div><div><div class="brand-name">Kwabo Coach</div><div class="brand-sub">Entraînement personnalisé</div></div>';
  top.appendChild(brand);
  wrap.appendChild(top);

  var main=h('main','view');
  var prog=h('div','stack');
  var order = draft.team ? TEAM_STEP_ORDER : [0,1,2,3,4,5];
  var pos = order.indexOf(step)+1, total = order.length;
  var lbl=h('div','between');
  lbl.innerHTML='<span class="step-label">Étape '+pos+' / '+total+'</span><span class="step-label">'+STEP_LABELS[step]+'</span>';
  prog.appendChild(lbl);
  var track=h('div','progress-track'); var fill=h('div','progress-fill'); fill.style.width=Math.round((pos/total)*100)+'%'; track.appendChild(fill);
  prog.appendChild(track);
  main.appendChild(prog);

  if(step===0) main.appendChild(stepSport());
  else if(step===1) main.appendChild(stepObjective());
  else if(step===2) main.appendChild(stepMorph());
  else if(step===3) main.appendChild(stepLevel());
  else if(step===4) main.appendChild(stepDuration());
  else main.appendChild(stepSummary());

  wrap.appendChild(main);
  return wrap;
}

function stepNav(canNext, onNext, lastLabel, onBack){
  var nav=h('div','row');
  var order = draft.team ? TEAM_STEP_ORDER : [0,1,2,3,4,5];
  if(order.indexOf(step) > 0){
    var back=h('button','btn btn-ghost','Retour');
    back.onclick = onBack || function(){ step--; render(); };
    nav.appendChild(back);
  }
  var spacer=h('div','spacer'); nav.appendChild(spacer);
  var next=h('button','btn btn-primary', lastLabel||'Continuer');
  next.disabled=!canNext;
  next.onclick=onNext;
  nav.appendChild(next);
  return nav;
}

function stepSport(){
  var box=h('div','stack');
  box.appendChild(h('p','muted small','Choisis un ou plusieurs sports (jusqu’à '+MAX_SPORTS+') : le programme combine leurs exercices. Tu pourras changer plus tard.'));
  var grid=h('div','chip-grid');
  SPORTS.forEach(function(s){
    var on = draft.sports.indexOf(s.id)>=0;
    var chip=h('button','chip'+(on?' on':''), '<span class="dot"></span>'+s.icon+' '+s.label);
    chip.disabled = !on && draft.sports.length>=MAX_SPORTS;
    chip.onclick=function(){
      if(on){ draft.sports=draft.sports.filter(function(id){return id!==s.id;}); delete draft.objectives[s.id]; }
      else if(draft.sports.length<MAX_SPORTS){ draft.sports=draft.sports.concat([s.id]); }
      render();
    };
    grid.appendChild(chip);
  });
  box.appendChild(grid);
  if(draft.sports.length>=MAX_SPORTS) box.appendChild(h('p','muted small','Maximum '+MAX_SPORTS+' sports à la fois, pour garder un programme réaliste.'));
  box.appendChild(stepNav(draft.sports.length>0, function(){ step=1; render(); }));
  var coachLinkBtn=h('button','link-btn row', icon('users')+' Tu es coach ? Crée un lien pour ton équipe');
  coachLinkBtn.onclick=function(){ openCoachSetup(); };
  box.appendChild(coachLinkBtn);
  return box;
}

function stepObjective(){
  var box=h('div','stack');
  box.appendChild(h('p','muted small','Un objectif par sport choisi. Uniquement physique — aucune technique gestuelle ici.'));
  var askWeightSport=null;
  draft.sports.forEach(function(sp){
    var sportLabel=(SPORTS.filter(function(s){return s.id===sp;})[0]||{}).label;
    if(draft.sports.length>1) box.appendChild(h('div','eyebrow', sportLabel));
    if(sp==='autre'){
      var lab0=h('label','field','Quel sport ? (facultatif)');
      var inp0=h('input'); inp0.type='text'; inp0.maxLength='30'; inp0.placeholder='Ex. escalade, judo…'; inp0.value=draft.otherSportName;
      inp0.oninput=function(){ draft.otherSportName=inp0.value; };
      lab0.appendChild(inp0); box.appendChild(lab0);
    }
    var named = OBJECTIVES[sp]||[];
    named.forEach(function(o){
      var card=h('button','obj-preset'+(draft.objectives[sp]===o.id?' on':''));
      card.innerHTML='<h3>'+o.title+'</h3><span class="muted small">'+o.desc+'</span>';
      card.onclick=function(){ draft.objectives[sp]=o.id; render(); };
      box.appendChild(card);
    });
    box.appendChild(h('p','muted small', named.length ? 'Ou cible une zone du corps :' : 'Choisis la partie du corps que tu veux développer davantage :'));
    ZONE_OBJECTIVES.forEach(function(o){
      var card=h('button','obj-preset'+(draft.objectives[sp]===o.id?' on':''));
      card.innerHTML='<h3>'+o.title+'</h3><span class="muted small">'+o.desc+'</span>';
      card.onclick=function(){ draft.objectives[sp]=o.id; render(); };
      box.appendChild(card);
    });
    if(draft.objectives[sp]){
      var sel=findObjective(sp, draft.objectives[sp]);
      if(sel && sel.askWeight) askWeightSport=sp;
    }
  });
  if(askWeightSport){
    box.appendChild(h('div','hr'));
    var lab=h('label','field','Poids actuel (kg)');
    var inp=h('input'); inp.type='number'; inp.min='30'; inp.max='250'; inp.value=draft.weight;
    inp.oninput=function(){draft.weight=inp.value;};
    lab.appendChild(inp); box.appendChild(lab);
    var lab2=h('label','field','Poids visé (kg)');
    var inp2=h('input'); inp2.type='number'; inp2.min='30'; inp2.max='250'; inp2.value=draft.targetWeight;
    inp2.oninput=function(){draft.targetWeight=inp2.value;};
    lab2.appendChild(inp2); box.appendChild(lab2);
  }
  var allChosen = draft.sports.every(function(sp){ return !!draft.objectives[sp]; });
  box.appendChild(stepNav(allChosen, function(){ step=2; render(); }));
  return box;
}

  var l2=h('label','field','Poids (kg)'); var i2=h('input'); i2.type='number'; i2.min='30'; i2.max='250'; i2.value=draft.weight; i2.oninput=function(){draft.weight=i2.value;}; l2.appendChild(i2);

  var box=h('div','stack');
  var sportPills = draft.sports.map(function(sp){ return '<span class="pill pill-accent">'+sportDisplayLabel(sp, draft.otherSportName)+'</span>'; }).join('');
  var objLabel = objectivesLabelOf(draft.sports, draft.objectives, draft.otherSportName);
  var card=h('div','card stack');
  card.appendChild(h('div','eyebrow','Ton profil'));
  card.appendChild(h('div','row row-wrap', sportPills+'<span class="pill pill-line">'+(LEVELS.filter(function(l){return l.id===draft.level;})[0]||{}).label+'</span>'));
  var h3=document.createElement('h3'); h3.style.textTransform='none'; h3.style.letterSpacing='0'; h3.style.fontFamily="'Manrope'"; h3.style.fontWeight='800'; h3.style.fontSize='16px'; h3.textContent=objLabel; card.appendChild(h3);
  card.appendChild(h('p','muted small','Cycle de '+draft.duration+' semaines · '+sessionsPerWeek(draft.level)+' séances / semaine'));

      : 'Perdre '+Math.abs(est.delta).toFixed(1)+' kg en gardant du muscle prend en général '+est.weeksLow+' à '+est.weeksHigh+' semaines. Ce cycle de '+draft.duration+' semaines est une première étape.';

  box.appendChild(card);
  box.appendChild(h('p','muted small','Le programme est généré à partir de ce profil. Tu pourras le régénérer, l’ajuster ou demander l’avis de l’IA ensuite.'));
  box.appendChild(stepNav(true, function(){
    state = {profile:draft, plan:generatePlan(draft), completion:{}, weights:draft.weight?[{date:Date.now(), value:parseFloat(draft.weight)}]:[], createdAt:Date.now()};
    saveState(state);
    activeTab='home';
    render();
  }, 'Générer mon programme', function(){ step = draft.team ? 3 : 4; render(); }));

/* ---------- HOME ---------- */
function weekIndexNow(){
  var days = Math.floor((Date.now()-state.createdAt)/86400000);
  var w = Math.floor(days/7);
  return Math.max(0, Math.min(w, state.plan.weeks.length-1));
}
function renderHome(){
  var v=h('div','view');
  var wi = weekIndexNow();
  var week = state.plan.weeks[wi];
  var done = week.sessions.filter(function(s){return state.completion[s.id];}).length;
  var pct = Math.round((done/week.sessions.length)*100);

  var hero=h('div','card row');
  var ring=ringSvg(pct);
  hero.appendChild(ring);
  var info=h('div','stack'); info.style.gap='4px'; info.style.flex='1';
  info.appendChild(h('div','eyebrow','Semaine '+(wi+1)+' / '+state.plan.weeks.length));
  info.appendChild(h('h2','','Salut 👋'));
  info.appendChild(h('p','muted small', done+' séance'+(done>1?'s':'')+' sur '+week.sessions.length+' terminée'+(done>1?'s':'')+' cette semaine.'));
  hero.appendChild(info);
  var shareBtn=h('button','icon-btn', icon('share'));
  shareBtn.title='Partager ma semaine';
  shareBtn.onclick=function(){ shareText(buildWeekShareText()); };
  hero.appendChild(shareBtn);
  v.appendChild(hero);

  var listTitle=h('div','between');
  listTitle.innerHTML='<h3 style="text-transform:none;letter-spacing:0;font-family:Manrope;font-weight:800;font-size:16px;margin:0">Cette semaine</h3>';
  v.appendChild(listTitle);

  week.sessions.forEach(function(s){ v.appendChild(sessionCard(s)); });

  if(week.deload){
    v.appendChild(h('p','muted small','🧘 Semaine allégée : volume réduit pour bien récupérer avant le prochain cycle.'));
  }
  return v;
}

function ringSvg(pct){
  var r=36, c=2*Math.PI*r;
  var off = c - (pct/100)*c;
  var wrap=h('div','ring-wrap');
  wrap.innerHTML='<svg width="88" height="88" viewBox="0 0 88 88">'+
    '<circle cx="44" cy="44" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="8"/>'+
    '<circle cx="44" cy="44" r="'+r+'" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'"/>'+
    '</svg><div class="ring-label"><b class="tabular">'+pct+'%</b><span>Semaine</span></div>';
  return wrap;
}

function sessionCard(s){
  var card=h('div','session-card');
  // Un <div> (jamais un <button>) : il contient plus bas un vrai <button> (la coche), et un bouton ne peut pas être imbriqué dans un autre.
  var head=h('div','session-head');
  head.setAttribute('role','button'); head.setAttribute('tabindex','0');
  var done = !!state.completion[s.id];
  var check=h('button','session-check'+(done?' done':''), done?icon('check'):'');
  check.type='button'; check.setAttribute('aria-pressed', done?'true':'false'); check.setAttribute('aria-label', done?'Marquer comme non terminée':'Marquer comme terminée');
  check.onclick=function(ev){ ev.stopPropagation(); state.completion[s.id]=!state.completion[s.id]; saveState(state); render(); };
  head.appendChild(check);
  var mid=h('div','stack'); mid.style.gap='2px'; mid.style.flex='1';
  mid.appendChild(h('div','session-title', s.title));
  mid.appendChild(h('div','session-meta', s.subtitle+' · '+s.exercises.length+' exercices'));
  head.appendChild(mid);
  var chev=h('div','chev'+(openSession===s.id?' open':''), icon('chev'));
  head.appendChild(chev);
  var toggleOpen=function(){ openSession = openSession===s.id? null : s.id; render(); };
  head.onclick=toggleOpen;
  head.onkeydown=function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); toggleOpen(); } };
  card.appendChild(head);
  if(openSession===s.id){
    var body=h('div','session-body');
    var voiceBtn=h('button','btn btn-ghost btn-sm', icon('mic')+' Suivre cette séance à la voix');
    voiceBtn.onclick=function(ev){ ev.stopPropagation(); startVoiceMode(s); };
    body.appendChild(voiceBtn);
    s.exercises.forEach(function(e, idx){
      var row=h('div','ex-row');
      var bar=h('div','ex-type'); bar.style.background=typeColor(e.type);
      row.appendChild(bar);
      var fig=h('div'); fig.innerHTML=moveIllustrationSvg(e.move); row.appendChild(fig);
      var mid2=h('div','stack'); mid2.style.gap='1px'; mid2.style.flex='1';
      mid2.appendChild(h('div','ex-name', e.name));
      mid2.appendChild(h('div','ex-scheme tabular', e.sets>1? e.sets+' séries × '+e.reps+' '+e.unit : e.reps+' '+e.unit));
      mid2.appendChild(h('div','ex-cue', e.cue));
      var timer = timerControl(s.id+'-'+idx, e);
      if(timer) mid2.appendChild(timer);
      row.appendChild(mid2);
      body.appendChild(row);
    });
    var shareLink=h('button','link-btn', icon('share')+' Partager cette séance');
    shareLink.onclick=function(ev){ ev.stopPropagation(); shareText(buildSessionShareText(s)); };
    body.appendChild(shareLink);
    card.appendChild(body);
  }
  return card;
}

/* ---------- PROGRAM (full cycle) ---------- */
function renderProgram(){
  var v=h('div','view');
  var head=h('div','between');
  head.innerHTML='<h2>Cycle complet</h2>';
  var regen=h('button','btn btn-ghost btn-sm', icon('refresh')+' Régénérer');
  regen.onclick=function(){
    state.profile.weekSeed = String(Math.random()).slice(2,8);
    state.plan = generatePlan(state.profile);
    state.completion = {};
    saveState(state); openSession=null; render();
  };
  head.appendChild(regen);
  v.appendChild(head);
  v.appendChild(h('p','muted small', state.plan.weeks.length+' semaines · '+state.plan.perWeek+' séances / semaine · niveau '+(LEVELS.filter(function(l){return l.id===state.profile.level;})[0]||{}).label));

  state.plan.weeks.forEach(function(week){
    var wrap=h('div','stack');
    var lbl = 'Semaine '+(week.index+1)+(week.deload?' · allégée':'');
    wrap.appendChild(h('div','eyebrow', lbl));
    week.sessions.forEach(function(s){ wrap.appendChild(sessionCard(s)); });
    v.appendChild(wrap);
  });
  return v;
}

/* ---------- REPAS ---------- */
var GOAL_LABEL = {prise_masse:'Prise de muscle', perte_poids:'Perte de poids', endurance:'Endurance', gainage:'Gainage', stabilite:'Stabilité', explosivite:'Explosivité', puissance_bas:'Jambes', vitesse:'Vitesse'};
function recipeCard(r, matched){
  var card=h('div','session-card');

  mid.appendChild(h('div','row row-wrap', tags));
  head.appendChild(mid);
  var price=h('div','tabular', recipeTotal(r)+' F'); price.style.fontWeight='800'; price.style.fontSize='15px'; price.style.flex='none';
  head.appendChild(price);
  card.appendChild(head);
  var body=h('div','session-body');

    row.appendChild(mid2);
    row.appendChild(h('div','tabular small', it.p>0?it.p+' F':'—'));
    body.appendChild(row);
  });
  body.appendChild(h('p','muted small', r.note));
  card.appendChild(body);
  return card;
}
function dayMenuCard(day, matched){

function weightSpark(){
  var pts=state.weights.slice(-10);
  var vals=pts.map(function(p){return p.value;});
  var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
  var range=(max-min)||1;
  var w=280, hgt=48, pad=6;
  var coords=pts.map(function(p,i){
    var x=pad+(i/(pts.length-1||1))*(w-pad*2);
    var y=pad+(1-((p.value-min)/range))*(hgt-pad*2);
    return x+','+y;
  }).join(' ');
  var box=h('div');
  box.innerHTML='<svg viewBox="0 0 '+w+' '+hgt+'" style="width:100%;height:52px;overflow:visible"><polyline points="'+coords+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  return box;
}

function encodeTeamCode(sport, objectiveId, duration){
  try{ return btoa(sport+'|'+objectiveId+'|'+duration).replace(/=+$/,''); }catch(e){ return ''; }
}
function decodeTeamCode(code){
  try{
    var pad = code + '===='.slice((code.length % 4) || 4);
    var parts = atob(pad).split('|');
    var sport = parts[0], objectiveId = parts[1], duration = parseInt(parts[2],10);
    if(!SPORTS.some(function(s){return s.id===sport;})) return null;
    var obj = findObjective(sport, objectiveId);
    if(!obj) return null;
    if([4,8,12].indexOf(duration)<0) return null;
    return {sport:sport, objectiveId:objectiveId, goals:obj.goals, duration:duration};
  }catch(e){ return null; }
}
function readTeamFromLocation(){
  try{
    if(typeof window==='undefined' || !window.location) return null;
    var code = new URLSearchParams(window.location.search).get('team');
    return code ? decodeTeamCode(code) : null;
  }catch(e){ return null; }
}

/* ================= MODE SÉANCE GUIDÉE (voix) ================= */
function speak(text, onDone){
  if(!ttsSupported){ if(onDone) onDone(); return; }
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang='fr-FR';
    var voices=window.speechSynthesis.getVoices();
    var fr=voices.filter(function(v){return /^fr/i.test(v.lang);})[0];
    if(fr) u.voice=fr;
    u.onend=function(){ if(onDone) onDone(); };
    u.onerror=function(){ if(onDone) onDone(); };
    window.speechSynthesis.speak(u);
  }catch(e){ if(onDone) onDone(); }
}
function stopSpeaking(){ try{ if(ttsSupported) window.speechSynthesis.cancel(); }catch(e){} }
function stopVoiceListening(){
  try{ if(voiceRecognizer) voiceRecognizer.abort(); }catch(e){}
  voiceRecognizer=null; voiceListening=false;
}
function announceCurrentExercise(){
  if(!voiceSession) return;
  var s=voiceSession.session, e=s.exercises[voiceSession.index];
  var scheme = e.sets>1 ? e.sets+' séries de '+e.reps+' '+e.unit : e.reps+' '+e.unit;
  voiceStatus='parle'; render();
  speak(e.name+'. '+scheme+'. '+e.cue, function(){
    if(!voiceSession) return;
    // Exercice chronométré : le minuteur se lance tout seul, et on écoute une fois le temps écoulé.
    if(e.timerKind==='countdown' || e.timerKind==='interval3030'){
      var key='voice-'+s.id+'-'+voiceSession.index;
      var onTimerDone=function(){ if(!voiceSession) return; speak('Temps écoulé.', function(){ if(!voiceSession) return; voiceStatus='ecoute'; render(); startVoiceListening(); }); };
      if(e.timerKind==='interval3030') startIntervalTimer(key, e.reps, onTimerDone);
      else startCountdownTimer(key, e.timerUnit==='m'?e.reps*60:e.reps, 'countdown', onTimerDone);
      return;
    }
    voiceStatus='ecoute'; render(); startVoiceListening();
  });
}
function startVoiceListening(){
  if(!voiceSupported || !voiceSession) return;
  var R = window.SpeechRecognition || window.webkitSpeechRecognition;
  try{
    var rec=new R(); voiceRecognizer=rec;
    rec.lang='fr-FR'; rec.continuous=false; rec.interimResults=false;
    rec.onresult=function(ev){ var t=String((ev.results&&ev.results[0]&&ev.results[0][0]&&ev.results[0][0].transcript)||'').toLowerCase(); handleVoiceCommand(t); };
    rec.onerror=function(ev){ voiceListening=false; if(ev.error==='not-allowed'||ev.error==='service-not-allowed') voiceSupported=false; if(voiceSession) render(); };
    rec.onend=function(){ voiceListening=false; };
    voiceListening=true;
    rec.start();
  }catch(e){ voiceListening=false; voiceSupported=false; if(voiceSession) render(); }
}
function handleVoiceCommand(text){
  if(!voiceSession) return;
  if(/suivant|next|c.est bon|termine( |$)|fini/.test(text)) goVoiceNext();
  else if(/pr[ée]c[ée]dent|retour|avant/.test(text)) goVoicePrev();
  else if(/arr[êe]te|stop|quitte/.test(text)) endVoiceSession(false);
  else startVoiceListening();
}
function cancelVoiceTimerIfAny(){
  if(activeTimer && activeTimer.key && activeTimer.key.indexOf('voice-')===0){ stopTimerInterval(); activeTimer=null; }
}
function goVoiceNext(){
  stopVoiceListening(); cancelVoiceTimerIfAny();
  if(voiceSession.index >= voiceSession.session.exercises.length-1){ endVoiceSession(true); return; }
  voiceSession.index += 1; announceCurrentExercise();
}
function goVoicePrev(){
  stopVoiceListening(); cancelVoiceTimerIfAny();
  if(voiceSession.index>0) voiceSession.index -= 1;
  announceCurrentExercise();
}
function endVoiceSession(markDone){
  stopVoiceListening(); stopSpeaking(); cancelVoiceTimerIfAny();
  if(markDone && voiceSession){ state.completion[voiceSession.session.id]=true; saveState(state); }
  var was=voiceSession; voiceSession=null; voiceStatus='';
  render();
  if(was && markDone) speak('Séance terminée, bravo !');
}
function startVoiceMode(session){ voiceSession={session:session, index:0}; render(); announceCurrentExercise(); }

  var nav=h('div','row'); nav.style.padding='12px 16px calc(12px + env(safe-area-inset-bottom,0px))';
  var prev=h('button','btn btn-ghost','Précédent'); prev.disabled=(idx===0); prev.onclick=function(){ goVoicePrev(); };

  next.onclick=function(){ goVoiceNext(); };
  nav.appendChild(prev); nav.appendChild(next);
  sheet.appendChild(nav);

  back.appendChild(sheet);
  return back;
}

/* ================= AI SHEET ================= */
var AI_SUGGESTIONS = [
  'Je n’ai pas de salle de sport, adapte mes séances',
  'J’ai un genou sensible, quels exercices éviter ?',
  'Explique pourquoi ce programme correspond à mon objectif',
  'Je veux une séance plus courte (20 min)'
];

function buildProfileSummaryText(){
  var p=state.profile;
  var sportLabel=sportsLabelOf(p.sports, p.otherSportName);
  var objLabel=objectivesLabelOf(p.sports, p.objectives, p.otherSportName);
  var week = state.plan.weeks[weekIndexNow()];
  var sessionsTxt = week.sessions.map(function(s){
    return s.title+' : '+s.exercises.map(function(e){return e.name+' ('+(e.sets>1?e.sets+'x'+e.reps:e.reps+' '+e.unit)+')';}).join(', ');
  }).join('\n');
  return 'Profil : sport '+sportLabel+', objectif "'+objLabel+'", niveau '+(LEVELS.filter(function(l){return l.id===p.level;})[0]||{}).label+
    ', morphologie '+(MORPHS.filter(function(m){return m.id===p.morph;})[0]||{}).label+
    (p.height?', taille '+p.height+' cm':'')+(p.weight?', poids '+p.weight+' kg':'')+
    '.\nSemaine actuelle du programme :\n'+sessionsTxt;
}

function renderAiSheet(){
  var back=h('div','sheet-backdrop');
  back.onclick=function(e){ if(e.target===back){ aiOpen=false; render(); } };
  var sheet=h('div','sheet');
  var head=h('div','sheet-head');
  head.innerHTML='<div style="flex:1"><div style="font-weight:800;font-size:15px">Coach IA</div><div class="muted small">À propos de ton programme</div></div>';
  var close=h('button','icon-btn', icon('close'));
  close.onclick=function(){ aiOpen=false; render(); };
  head.appendChild(close);
  sheet.appendChild(head);

  var body=h('div','sheet-body'); body.id='ai-body';
  if(aiCapability===null){
    body.appendChild(h('div','msg sys','L’assistant IA n’est pas disponible dans cet aperçu. Ton programme reste entièrement utilisable sans lui : bibliothèque d’exercices, suivi et progression fonctionnent normalement.'));
  } else if(aiMessages.length===0){
    body.appendChild(h('div','msg sys','Pose une question sur ton programme : adaptation, douleur, matériel, objectif...'));
  }
  aiMessages.forEach(function(m){
    body.appendChild(h('div','msg '+(m.role==='user'?'me':'ai'), escapeHtml(m.text)));
  });
  if(aiBusy){
    var t=h('div','msg ai'); t.innerHTML='<span class="typing"><i></i><i></i><i></i></span>'; body.appendChild(t);
  }
  sheet.appendChild(body);

  if(aiCapability!==null && aiMessages.length===0){
    var sug=h('div','sheet-suggest');
    AI_SUGGESTIONS.forEach(function(s){
      var b=document.createElement('button'); b.textContent=s;
      b.onclick=function(){ sendAi(s); };
      sug.appendChild(b);
    });
    sheet.appendChild(sug);
  }

  var inputRow=h('div','sheet-input');
  var inp=h('input'); inp.type='text'; inp.placeholder= aiCapability===null ? 'Indisponible dans cet aperçu' : 'Écris ta question…'; inp.disabled = aiCapability===null || aiBusy;
  inp.onkeydown=function(e){ if(e.key==='Enter' && inp.value.trim()){ sendAi(inp.value.trim()); inp.value=''; } };
  var send=h('button','icon-btn', icon('send'));
  send.disabled = aiCapability===null || aiBusy;
  send.onclick=function(){ if(inp.value.trim()){ sendAi(inp.value.trim()); inp.value=''; } };
  inputRow.appendChild(inp); inputRow.appendChild(send);
  sheet.appendChild(inputRow);

  back.appendChild(sheet);
  setTimeout(function(){ var b=document.getElementById('ai-body'); if(b) b.scrollTop=b.scrollHeight; },0);
  return back;
}

function escapeHtml(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function sendAi(text){
  if(!aiCapability || aiBusy) return;
  aiMessages.push({role:'user', text:text});
  aiBusy=true; render();
  var system = 'Tu es un coach sportif prudent et concret, tu réponds en français, en 3 à 6 phrases maximum, sans markdown ni listes à puces longues. Tu t’appuies sur le profil et le programme fournis. Tu ne donnes jamais de conseil médical précis : en cas de douleur, tu recommandes prudence et avis d’un professionnel de santé si besoin. Réponses courtes, concrètes, orientées action.';
  var context = buildProfileSummaryText();
  var input = [{role:'user', content: system+'\n\nContexte :\n'+context+'\n\nQuestion : '+text}];
  aiCapability(input, {modelTier:'quick', cache:false}).then(function(res){
    aiBusy=false;
    aiMessages.push({role:'assistant', text:(res&&res.text)||'Je n’ai pas pu répondre, réessaie.'});
    render();
  }).catch(function(err){
    aiBusy=false;
    var code = err && err.code;
    var msg = code==='not_granted' ? 'Tu as refusé l’accès à l’IA pour cette page.' :
              code==='rate_limited' ? 'Trop de questions d’un coup, réessaie dans un instant.' :
              'La réponse a échoué, réessaie.';
    aiMessages.push({role:'assistant', text:msg});
    render();
  });
}

/* ================= DÉMARRAGE ================= */
function boot(){
  render();
  if(supabaseClient){
    supabaseClient.auth.getSession().then(function(res){
      session = res && res.data ? res.data.session : null;
      if(session) applyRemoteProfileOnSignIn(); else render();
    }).catch(function(){ render(); });
    supabaseClient.auth.onAuthStateChange(function(event, sess){
      var wasLoggedIn = !!session;
      session = sess;
      if(event==='SIGNED_IN' && !wasLoggedIn) applyRemoteProfileOnSignIn();
      else render();
    });
  }
}
boot();
})();
</script>
